- name: Add new domain to ispmanager
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    isp_host: "https://{{ vault_hosting_ip }}:1500/ispmgr"

  tasks:
    - name: Create web domain
      ansible.builtin.uri:
        url: "{{ isp_host }}"
        method: POST
        validate_certs: no
        timeout: 120
        body_format: form-urlencoded
        body:
          authinfo: "{{ vault_hosting_user }}:{{ vault_hosting_password }}"
          func: webdomain.edit
          name: "{{ vault_hosting_domain }}"
          email: "{{ vault_hosting_email }}"
          cgi: "on"
          regru_python: "on"
          passenger_python_version: "python-3.12"
          out: xml
          sok: ok
        return_content: true
      register: isp_result
      failed_when: >
        not (isp_result.content | default('') | lower | regex_search('<ok|type="exists"'))

    - name: Report that the domain already exists
      ansible.builtin.debug:
        msg: "Domain '{{ vault_hosting_domain }}' already exists in ispmanager - nothing to create, continuing."
      when: isp_result.content is search('type="exists"')

    - name: Show domain form
      ansible.builtin.debug:
        var: isp_result.content
      when: isp_result.content is search('<ok')
