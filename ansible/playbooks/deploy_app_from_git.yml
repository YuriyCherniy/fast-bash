- name: Deliver app code from git repository
  hosts: app_servers
  gather_facts: no

  vars:
    user: "{{ vault_hosting_user }}"
    domain: "{{ vault_hosting_domain }}"
    repo_url: "https://github.com/YuriyCherniy/fast-bash.git"
    repo_version: "dev"
    repo_path: "/var/www/{{ user }}/data/fast_bash_repo"
    app_path: "/var/www/{{ user }}/data/www/{{ domain }}/fast_bash"
    domain_root: "/var/www/{{ user }}/data/www/{{ domain }}"

  tasks:
    - name: Clone/update app repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        version: "{{ repo_version }}"
        force: yes
        depth: 1
        single_branch: yes

    - name: Sync app/ contents into application directory
      ansible.builtin.copy:
        src: "{{ repo_path }}/app/"
        dest: "{{ app_path }}/"
        remote_src: yes

    - name: Deploy passenger_wsgi.py into domain root
      ansible.builtin.copy:
        src: "{{ repo_path }}/app/passenger_wsgi.py"
        dest: "{{ domain_root }}/passenger_wsgi.py"
        remote_src: yes
        mode: "0644"

    - name: Remove passenger_wsgi.py duplicate from app subdir
      ansible.builtin.file:
        path: "{{ app_path }}/passenger_wsgi.py"
        state: absent

    - name: Collect static files
      ansible.builtin.command:
        cmd: "{{ app_path }}/manage.py collectstatic --noinput"
        chdir: "{{ app_path }}"

    - name: Touch restart.txt in domain root to restart Passenger
      ansible.builtin.file:
        path: "{{ domain_root }}/restart.txt"
        state: touch
        mode: "0644"
