- name: Install the app requirements into the python venv
  hosts: app_servers
  gather_facts: no

  vars:
    hosting_user: "{{ vault_hosting_user }}"
    domain: "{{ vault_hosting_domain }}"
    venv_path: /var/www/{{ hosting_user }}/data/.venv
    app_path: /var/www/{{ hosting_user }}/data/www/{{ domain }}/fast_bash
    requirements_path: "{{ app_path }}/requirements.txt"

  tasks:
    - name: Install the app requirements into the venv
      ansible.builtin.pip:
        requirements: "{{ requirements_path }}"
        virtualenv: "{{ venv_path }}"
