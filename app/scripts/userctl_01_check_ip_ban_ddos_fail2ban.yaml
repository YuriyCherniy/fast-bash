title: "Проверить IP адрес на бан сервером"
description: "Выполняет проверку userctl fw list, лог DDoS (последние 5 совпадений) и fail2ban (последние 5 совпадений)"
args: "<IP>"
content: |
  #!/bin/bash
  set -euo pipefail
  source common.sh

  IP="${1:?Usage: bash -s IP}"

  run sudo /usr/local/bin/userctl fw list "$IP" || true
  echo "====="

  if sudo /usr/local/bin/sup_exec grep -q -F "$IP" /var/log/ddos_detect.log; then
      run bash -c "sudo /usr/local/bin/sup_exec grep --color=always -F \"$IP\" /var/log/ddos_detect.log | tail -n 5"
  else
      echo "Совпадений в /var/log/ddos_detect.log не найдено"
  fi
  echo "====="

  if sudo /usr/local/bin/sup_exec grep -q -F "$IP" /var/log/fail2ban.log; then
      run bash -c "sudo /usr/local/bin/sup_exec grep --color=always -F \"$IP\" /var/log/fail2ban.log | tail -n 5"
  else
      echo "Совпадений в /var/log/fail2ban.log не найдено"
  fi
