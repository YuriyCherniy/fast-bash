
title: "Проверить парковку домена на server256"
description: "Выполняет grep по логу /var/log/addstolendomains на server256"
args: "<domain.ru|u1234567>"
content: |
  #!/bin/bash
  set -euo pipefail
  source common.sh

  INPUT="${1:?Usage: bash -s domain.ru|u1234567}"
  
  if sudo /usr/local/bin/sup_exec grep -q -F "$INPUT" /var/log/addstolendomains; then
      run bash -c "sudo /usr/local/bin/sup_exec grep --color=always -F \"$INPUT\" /var/log/addstolendomains | tail -n 10"
  else
      echo "Совпадений в ddos_detect.log не найдено"
  fi
