title: "Проверить IP адрес на бан сервером"
description: "Выполняет проверку userctl fw list, лог DDoS (последние 5 совпадений) и fail2ban (последние 5 совпадений)"
args: "<IP>"
content: |
  #!/bin/bash
  set -euo pipefail
  source common.sh

  IP="$1"

  show_last() {
    local log="$1"
    local out
    out=$(sudo /usr/local/bin/sup_exec grep --color=always -F "$IP" "$log" | tail -n 5 || true)
    if [ -z "$out" ]; then
      echo "Совпадений в $(basename "$log") не найдено"
    else
      printf '%s\n' "$out"
    fi
  }

  run sudo /usr/local/bin/userctl fw list "$IP" || true
  echo "====="
  run show_last /var/log/ddos_detect.log || true
  echo "====="
  run show_last /var/log/fail2ban.log || true
