title: "Проверить IP адрес на бан сервером"
description: "Выполняет проверку userctl fw list, лог DDoS (последние 5 совпадений) и fail2ban (последние 5 совпадений)"
args: "<IP>"
content: |
  #!/bin/bash
  set -euo pipefail
  source common.sh

  IP="$1"
  run sudo /usr/local/bin/userctl fw list "$IP" || true
  echo "====="
  if run sudo /usr/local/bin/sup_exec grep -q -F "$IP" /var/log/ddos_detect.log; then
      run bash -c "sudo /usr/local/bin/sup_exec grep --color=always -F \"$IP\" /var/log/ddos_detect.log | tail -n 5" _ "$IP" || true
  else
      echo "Совпадений в ddos_detect.log не найдено"
  fi
  echo "====="
  if run sudo /usr/local/bin/sup_exec grep -q -F "$IP" /var/log/fail2ban.log; then
      run bash -c "sudo /usr/local/bin/sup_exec grep --color=always -F \"$1\" /var/log/fail2ban.log | tail -n 5" _ "$IP" || true
  else
      echo "Совпадений в fail2ban.log не найдено"
  fi
