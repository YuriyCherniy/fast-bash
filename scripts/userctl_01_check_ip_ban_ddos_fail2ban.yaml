title: "Проверить IP адрес на бан сервером"
description: "Выполняет проверку userctl fw list, лог DDoS и fail2ban"
args: "<IP>"
content: |
  #!/bin/bash
  set -euo pipefail
  source common.sh

  IP="$1"
  run sudo /usr/local/bin/userctl fw list "$IP" || true
  run bash -c 'sudo /usr/local/bin/sup_exec grep --color=always -F "$1" /var/log/ddos_detect.log | tail -n 5' _ "$IP" || true
  run bash -c 'sudo /usr/local/bin/sup_exec grep --color=always -F "$1" /var/log/fail2ban.log | tail -n 5' _ "$IP" || true
