title: "Проверить IP адрес на бан сервером"
description: "Выплолняет проверку userctl, лог DDoS и fail2ban"
args: "<IP>"
content: |
  #!/bin/bash
  set -euo pipefail
  source common.sh

  IP="$1"
  run sudo /usr/local/bin/userctl fw list "$IP"
  run sudo /usr/local/bin/sup_exec grep --color "$IP" /var/log/ddos_detect.log
  run sudo /usr/local/bin/sup_exec grep --color "$IP" /var/log/fail2ban.log

